rif" font-size="12" font-weight="400" fill="#6A7B93">错误</text><rect x="484" y="884" width="188" height="44" rx="8" fill="white" stroke="#C84454"/><text x="496" y="911" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#C84454">名称不能为空</text><rect x="726" y="774" width="674" height="202" rx="12" fill="#FFFFFF" stroke="#E3E9F2"/><text x="748" y="808" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#172B4D">06  状态与反馈</text><text x="748" y="834" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#6A7B93">成功 / 待处理 / 错误需配文字和下一步。</text><rect x="750" y="879" width="188" height="48" rx="8" fill="#E9F6F1" stroke="none"/><text x="766" y="910" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#16816B">已保存</text><rect x="961" y="879" width="188" height="48" rx="8" fill="#FFF7E8" stroke="none"/><text x="977" y="910" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#9D641D">需要决定</text><rect x="1172" y="879" width="188" height="48" rx="8" fill="#FFF1F2" stroke="none"/><text x="1188" y="910" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#C84454">检查输入</text><rect x="40" y="996" width="666" height="182" rx="12" fill="#FFFFFF" stroke="#E3E9F2"/><text x="62" y="1030" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="600" fill="#172B4D">07  节点与选中</text><text x="62" y="1056" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" fill="#6A7B93">节点区分事件、判断、动作；端口表明输入输出与执行域。</text><rect x="62" y="1080" width="188" height="64" rx="9" fill="white" stroke="#E3E9F2"/><rect x="62" y="1080" width="188" height="4" rx="2" fill="#43A28D" stroke="none"/><text x="74" y="1108" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" fill="#172B4D">事件 · 碰到水晶</text><text x="74" y="1130" font-