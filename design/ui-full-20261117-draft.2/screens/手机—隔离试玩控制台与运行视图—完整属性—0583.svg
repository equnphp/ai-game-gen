ill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">试玩内容版本、保存选择与种子</text><g data-field-id="SUR-ST-050::sourcePolicy"><text x="16" y="456" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">试玩内容来源</text><rect x="16" y="470" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="496" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">查看 / 编辑</text></g><text x="16" y="540" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">另一选项为用户明确选择试玩最近已保存版；不能无声忽略当前草稿</text><g data-field-id="SUR-ST-050::draftSummary"><text x="16" y="572" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">当前未保存/待应用修改摘要</text><rect x="16" y="586" width="358" height="40" rx="8" fill="#F5F7FB" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="612" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">查看当前项目</text><text x="374" y="641" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">变化项/校验状态</text></g><text x="16" y="664" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">合法、非法、冲突和待确认分别列；无实际数据不能写无修改</text><g data-field-id="SUR-ST-050::fixedRevision"><text x="16" y="696" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">将用于试玩的固定版本</text><rect x="16" y="710" width="358" height="40" rx="8" fill="#F5F7FB" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="736" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">r128 · 本机示例</text><text x="374" y="765" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">实际revision/快照ID</text></g><text x="16" y="788" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">保存请求受理不构成已保存快照；不得混入后续草稿</text><g data-field-id="SUR-ST-050::seedPolicy"><text x="16" y="820" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">本次运行种子策略</text><rect x="16" y="834" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="860" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">沿用当前预设</text><g transform="translate(346 846) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="374" y="889" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">策略枚举</text></g><text x="16" y="912" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">重试/读档保持源规则，不另设随机时钟模型</text><g data-field-id="SUR-ST-050::seedValue"><text x="16" y="944" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">本次实际种子</text><rect x="16" y="958" width="358" height="40" rx="8" fill="#F5F7FB" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="984" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">查看当前项目</text><text x="374" y="1013" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">种子契约编码</text></g><text x="16" y="1036" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">测试手输仅在允许的隔离试玩范围；不改变正式轮次/持久世界种子</text><g data-field-id="SUR-ST-050::controls"><text x="16" y="1094" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">运行/暂停/单步/慢速/重启/停止</text><rect x="16" y="1108" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1134" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">未开始</text></g><text x="16" y="1178" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">预览时钟与正式服务分开</text><g data-field-id="SUR-ST-050::device"><text x="16" y="1237" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">触控/键鼠/手柄、比例/安全区</text><rect x="16" y="1251" width="358" height="40" rx="8" fill="#F5F7FB" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1277" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">1.00</text></g><text x="16" y="1321" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">无法模拟能力明确不支持</text><g data-field-id="SUR-ST-050::debug"><text x="16" y="1380" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">碰撞/导航/触发/遮挡/变量</text><rect x="16" y="1394" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1420" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">关闭或上次值</text><g transform="translate(346 1406) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g></g><text x="16" y="1464" fill="#6A7B93" font-