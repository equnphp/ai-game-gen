" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">＋ 添加一项</text></g><text x="16" y="1356" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">入口连接可站立面</text><rect x="4" y="1393" width="382" height="44" rx="9" fill="#EDF4FF" stroke="none" stroke-width="1"/><text x="16" y="1415" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="600" text-anchor="start">绑定面/高度范围</text><g data-field-id="SUR-GM-010::SUR-GM-010-F05-H00"><text x="16" y="1467" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">高度过滤模式</text><rect x="16" y="1481" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1507" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">待按当前面校准</text><g transform="translate(346 1493) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g></g><text x="16" y="1551" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">只列当前组件已声明能力；切换不清除隐藏区间或改变图片显示偏移</text><g data-field-id="SUR-GM-010::SUR-GM-010-F05-H01"><text x="16" y="1583" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">基准通行面</text><rect x="16" y="1597" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1623" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">继承地图的空间定义</text><g transform="translate(346 1609) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="374" y="1652" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">通行面ID</text></g><text x="16" y="1675" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">面/地图版本存在；跟随对象时以实际权威面为基准，不以屏幕层/Y坐标推断</text><g data-field-id="SUR-GM-010::SUR-GM-010-F05-H02"><text x="16" y="1707" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">垂直区间基准</text><rect x="16" y="1721" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1747" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">继承地图的空间定义</text><g transform="translate(346 1733) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="374" y="1776" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">项目逻辑高度坐标系</text></g><text x="16" y="1799" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">只能在有明确转换契约的坐标基准间切换；不按32像素/层直接转换物理米或场…</text><g data-field-id="SUR-GM-010::SUR-GM-010-F05-H03"><text x="16" y="1831" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">垂直最小值</text><rect x="16" y="1845" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1871" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">待按当前面校准</text><g transform="translate(346 1857) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="374" y="1900" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">项目/地图声明的逻辑高度单位</text></g><text x="16" y="1923" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">有限数，最小&lt;=最大；机器范围/零厚度支持按能力表；明确区间边界包含规则</text><g data-field-id="SUR-GM-010::SUR-GM-010-F05-H04"><text x="16" y="1955" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">垂直最大值</text><rect x="16" y="1969" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1995" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">待按当前面校准</text><g transform="translate(346 1981) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="374" y="2024" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">与最小值相同的逻辑高度单位</text></g><text x="16" y="2047" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">有限数且&gt;=最小；上限不由UI臆造，不能以图片像素高度补值</text><g data-field-id="SUR-GM-010::SUR-GM-010-F05-H05"><text x="16" y="2079" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">区间单位/边界说明</text><rect x="16" y="2093" width="358" height="40" rx="8" fill="#F5F7FB" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="2119" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">查看当前项目</text><text x="374" y="2148" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">共享高度契约</text></g><text x="16" y="2171" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">显示实际能力，缺能力标未支持；同一单位/基准交给共享核心比较，不在UI复…</text><rect x="16" y="2238" width="358" height="44" rx="8" fill="#246BEE" stroke="none" stroke-width="1"/><text x="195" y="2265" fill="#FFFFFF" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">叠加预览</text><rect x="16" y="2296" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="195" y="2323" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">应用校准</text></svg>