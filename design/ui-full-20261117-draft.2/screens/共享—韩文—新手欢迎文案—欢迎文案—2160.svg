<svg xmlns="http://www.w3.org/2000/svg" width="430" height="500" viewBox="0 0 430 500" role="img"><title>ko-KR · onboarding copy layout draft</title><rect x="0" y="0" width="430" height="500" rx="16" fill="white" stroke="#E2E9F2" stroke-width="1"/><g transform="translate(26 27) scale(1.4166666666666667)" stroke="#246BEE" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7ZM21 2v4m-2-2h4"/></g><text x="26" y="108" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="400" text-anchor="start">첫 번째 플레이 가능한 레벨 만들</text><text x="26" y="139" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="400" text-anchor="start">기</text><text x="26" y="183" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">내장 예제의 모습과 동작을 바꾼 뒤 저장하고 플레이하세</text><text x="26" y="207" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">요. 기본 안내는 모델 설정 없이 오프라인에서 사용할 </text><text x="26" y="231" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">수 있습니다.</text><rect x="26" y="300" width="378" height="47" rx="8" fill="#246BEE" stroke="none" stroke-width="1"/><text x="215" y="328.5" fill="#FFFFFF" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">튜토리얼 시작</text><rect x="26" y="359" width="378" height="47" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="215" y="387.5" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">건너뛰고 제작 시작</text><text x="26" y="446" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">언제든 건너뛸 수 있으며 도움말 및 학습에서 다시 시작할 수 있</text><text x="26" y="