<svg xmlns="http://www.w3.org/2000/svg" width="430" height="500" viewBox="0 0 430 500" role="img"><title>zh-CN · onboarding copy layout draft</title><rect x="0" y="0" width="430" height="500" rx="16" fill="white" stroke="#E2E9F2" stroke-width="1"/><g transform="translate(26 27) scale(1.4166666666666667)" stroke="#246BEE" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7ZM21 2v4m-2-2h4"/></g><text x="26" y="108" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="23" font-weight="400" text-anchor="start">做出第一个可玩的关卡</text><text x="26" y="183" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">用内置示例改外观、改行为，再保存试玩。基础引导离线可用</text><text x="26" y="207" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">，无需先配置模型。</text><rect x="26" y="300" width="378" height="47" rx="8" fill="#246BEE" stroke="none" stroke-width="1"/><text x="215" y="328.5" fill="#FFFFFF" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">开始引导</text><rect x="26" y="359" width="378" height="47" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="215" y="387.5" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">跳过，直接创作</text><text x="26" y="446" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">随时可以跳过，稍后从帮助与学习继续。</text></svg>