="1101" y="748" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">准确标本机可继续/已暂停/待恢复，不承诺系统杀进程后</text><text x="1101" y="768" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">仍运行。</text><text x="1101" y="821" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">查看活动与可恢复操作  →</text><rect x="1088" y="827" width="252" height="26" rx="6" fill="#EDF4FF" stroke="none" stroke-width="1"/><text x="1099" y="845" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="500" text-anchor="start">费用来源：你的服务账户</text><text x="208" y="943" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">当前轮次使用发送时固定的模型、工具与权限；设置变更从下一轮生效。</text></svg>