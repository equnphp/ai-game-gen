<rect x="826" y="276" width="546" height="84" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="838" y="300" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">--service</text><text x="1354" y="300" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><path d="M836 311L1362 311" fill="none" stroke="#E2E9F2" stroke-width="1" /><text x="838" y="329" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">project-tools</text><text x="1354" y="329" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><text x="838" y="352" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">＋ 添加一项</text></g><text x="826" y="396" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">每一数值参数各画控件；整数/小数、范围、单位来自该参数Schema；禁止NaN/Infinity</text><g data-field-id="SUR-WN-003::SUR-WN-003-F02-02"><text x="252" y="405" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="500" text-anchor="start">布尔参数</text><rect x="252" y="419" width="546" height="38" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="264" y="444" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">该参数Schema默认</text><rect x="750" y="428" width="34" height="20" rx="10" fill="#246BEE" stroke="none" stroke-width="1"/><circle cx="775" cy="438" r="7" fill="white" stroke="none" stroke-width="1"/><text x="798" y="474" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">不适用</text></g><text x="252" y="497" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">每一布尔参数独立开关；无默认且必填时须明确选择</text><g data-field-id="SUR-WN-003::SUR-WN-003-F02-03"><text x="826" y="455" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="500" text-anchor="start">枚举参数</text><rect x="826" y="469" width="546" height="84" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="838" y="493" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">--service</text><text x="1354" y="493" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><path d="M836 504L1362 504" fill="none" stroke="#E2E9F2" stroke-width="1" /><text x="838" y="522" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">project-tools</text><text x="1354" y="522" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><text x="838" y="545" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">＋ 添加一项</text></g><text x="826" y="589" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">只能选已声明合法枚举；不自动取第一项冒充默认</text><g data-field-id="SUR-WN-003::SUR-WN-003-F02-04"><text x="252" y="556" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="500" text-anchor="start">文本参数</text><rect x="252" y="570" width="546" height="84" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="264" y="594" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">--service</text><text x="780" y="594" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><path d="M262 605L788 605" fill="none" stroke="#E2E9F2" stroke-width="1" /><text x="264" y="623" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">project-tools</text><text x="780" y="623" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><text x="264" y="646" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">＋ 添加一项</text></g><text x="252" y="690" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">单/多行按Schema；长度/格式引用该参数定义；禁止将自由代码当可执行参数</text><g data-field-id="SUR-WN-003::SUR-WN-003-F02-05"><text x="826" y="648" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="500" text-anchor="start">集合参数</text><rect x="826" y="662" width="546" height="84" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="838" y="686" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">--service</text><text x="1354" y="686" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><path d="M836 697L1362 697" fill="none" stroke="#E2E9F2" stroke-width="1" /><text x="838" y="715" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">project-tools</text><text x="1354" y="715" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><text x="838" y="738" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">＋ 添加一项</text></g><text x="826" y="782" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-si