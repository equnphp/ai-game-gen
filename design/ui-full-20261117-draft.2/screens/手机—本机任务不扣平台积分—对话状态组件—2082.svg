<svg xmlns="http://www.w3.org/2000/svg" width="358" height="338" viewBox="0 0 358 338" role="img"><title>本机任务不扣平台积分</title><rect x="0" y="0" width="358" height="338" rx="14" fill="white" stroke="#E2E9F2" stroke-width="1"/><g transform="translate(17 20) scale(0.9166666666666666)" stroke="#246BEE" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></g><text x="49" y="39" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">本机任务不扣平台积分</text><text x="20" y="73" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="600" text-anchor="start">当前情况</text><text x="20" y="100" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">本机任务来源、资源占用与任务进度。</text><text x="20" y="140" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="600" text-anchor="start">可以继续做什么</text><rect x="20" y="158" width="318" height="44" rx="8" fill="#246BEE" stroke="none" stroke-width="1"/><text x="179" y="185" fill="#FFFFFF" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">查看本地组件/用量</text><rect x="20" y="212" width="318" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="179" y="239" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">取消允许步骤</text><text x="20" y="273" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="600" text-anchor="start">恢复与保留</text><text x="20" y="297" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">不显示虚拟冻结积分；远程服务另按实际来源。</text></svg>