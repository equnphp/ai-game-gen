ight="400" text-anchor="start">⋮</text><text x="28" y="351" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">＋ 添加一项</text></g><text x="16" y="395" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">名称/别名/证书指纹/用途；私钥不进项目</text><g data-field-id="SUR-WN-056::SUR-WN-056-F02"><text x="16" y="454" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">创建/导入</text><rect x="16" y="468" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="494" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">用户选择</text></g><text x="16" y="538" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">文件与密码经安全宿主管理，不在日志/AI/导出游戏留存</text><g data-field-id="SUR-WN-056::SUR-WN-056-F03"><text x="16" y="597" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">调试/正式</text><rect x="16" y="611" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="637" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">用户明确目标</text><g transform="translate(346 623) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g></g><text x="16" y="681" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">两者明显区分，更新需同包名/签名和更高版本号</text><g data-field-id="SUR-WN-056::SUR-WN-056-F04"><text x="16" y="740" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">备份导出</text><rect x="16" y="754" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="780" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">默认不备份到项目/LAN</text></g><text x="16" y="824" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">说明丢失影响；目标受用户授权，不分享给设备同步</text><g data-field-id="SUR-WN-056::SUR-WN-056-F05"><text x="16" y="883" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">密码/保存策略</text><rect x="16" y="897" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="923" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">••••••••  ·  本设备</text><g transform="translate(346 909) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g></g><text x="16" y="967" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">系统不可用不明文回退</text><rect x="16" y="1035" width="358" height="44" rx="8" fill="#246BEE" stroke="none" stroke-width="1"/><text x="195" y="1062" fill="#FFFFFF" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">选择签名引用</text><rect x="16" y="1093" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="195" y="1120" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">备份/导入身份</text><rect x="16" y="1151" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="195" y="1178" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">删除身份</text></