oe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">＋ 添加一项</text></g><g data-field-id="CMP-07-328"><text x="58" y="342" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="500" text-anchor="start">草稿将保存在本机</text><rect x="58" y="356" width="600" height="40" rx="8" fill="#F5F7FB" stroke="#E2E9F2" stroke-width="1"/><text x="70" y="382" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">查看当前项目</text></g><rect x="58" y="444" width="600" height="44" rx="8" fill="#246BEE" stroke="none" stroke-width="1"/><text x="358" y="471" fill="#FFFFFF" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">保留草稿并返回</text><rect x="58" y="498" width="600" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="358" y="525" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">保存后离开</text><rect x="58" y="552" width="600" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="358" y="579" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">放弃未提交输入</text><text x="726" y="177" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">默认</text><rect x="726" y="190" width="306" height="44" rx="8" fill="white" stroke="#E2E9F2" stroke-width="1"/><text x="740" y="217" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">输入内容</text><text x="726" y="289" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">焦点</text><rect x="726" y="302" width="306" height="44" rx="8" fill="white" stroke="#246BEE" stroke-width="1"/><text x="740" y="329" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">当前编辑</text><text x="726" y="401" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">禁用 / 只读</text><rect x="726" y="414" width="306" height="44" rx="8" fill="#F5F7FB" stroke="#E2E9F2" stroke-width="1"/><text x="740" y="441" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">保留现有值</text><text x="726" y="513" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">校验失败</text><rect x="726" y="526" width="306" height="44" rx="8" fill="white" stroke="#C64555" stroke-width="1"/><text x="740" y="553" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">值超出允许范围</text><text x="726" y="590" fill="#C64555" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">保留草稿，可定位修复</text><text x="58" y="728" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">行为</text><text x="58" y="752" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">只在确有未提交输入时提示；任务继续与输入草稿分别处理；关闭浮层不隐式保存/执行。</text><text x="58" y="795" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">约束</text><text x="58" y="819" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">不可保存时说明原因，不给永远转圈；放弃草稿不撤销已提交事务。</text><text x="58" y="862" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">恢复</text><text x="58" y="886" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">返回还原焦点与输入；系统退出/重建保存可恢复草稿和任务身份，恢复后核原项目。</text></svg>