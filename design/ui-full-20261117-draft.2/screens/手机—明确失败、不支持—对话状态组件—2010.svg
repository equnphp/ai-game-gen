<svg xmlns="http://www.w3.org/2000/svg" width="358" height="392" viewBox="0 0 358 392" role="img"><title>明确失败/不支持</title><rect x="0" y="0" width="358" height="392" rx="14" fill="white" stroke="#E2E9F2" stroke-width="1"/><g transform="translate(17 20) scale(0.9166666666666666)" stroke="#246BEE" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></g><text x="49" y="39" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">明确失败/不支持</text><text x="20" y="73" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="600" text-anchor="start">当前情况</text><text x="20" y="100" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">脱敏原因、影响对象、配置/依赖修复入口。</text><text x="20" y="140" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="600" text-anchor="start">可以继续做什么</text><rect x="20" y="158" width="318" height="44" rx="8" fill="#246BEE" stroke="none" stroke-width="1"/><text x="179" y="185" fill="#FFFFFF" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">修复</text><rect x="20" y="212" width="318" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="179" y="239" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">查看详情</text><rect x="20" y="266" width="318" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="179" y="293" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">满足幂等条件才重试</text><text x="20" y="327" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="600" text-anchor="start">恢复与保留</text><text x="20" y="351" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">失败项目事务不部分提交；不把工具未安装说成网络错误。</text></svg>