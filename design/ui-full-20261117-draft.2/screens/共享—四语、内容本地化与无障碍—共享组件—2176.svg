-width="2"/><rect x="603" y="310" width="55" height="34" rx="7" fill="white" stroke="#E2E9F2" stroke-width="1"/><text x="629" y="332" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="middle">80%</text></g><g data-field-id="CMP-16-392"><text x="58" y="406" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="500" text-anchor="start">键盘焦点 / 状态名称</text><rect x="58" y="420" width="600" height="40" rx="8" fill="#F5F7FB" stroke="#E2E9F2" stroke-width="1"/><text x="70" y="446" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">冒险家</text></g><rect x="58" y="508" width="600" height="44" rx="8" fill="#246BEE" stroke="none" stroke-width="1"/><text x="358" y="535" fill="#FFFFFF" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">跟随系统</text><rect x="58" y="562" width="600" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="358" y="589" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">预览长文</text><text x="726" y="177" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">默认</text><rect x="726" y="190" width="306" height="44" rx="8" fill="white" stroke="#E2E9F2" stroke-width="1"/><text x="740" y="217" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">输入内容</text><text x="726" y="289" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">焦点</text><rect x="726" y="302" width="306" height="44" rx="8" fill="white" stroke="#246BEE" stroke-width="1"/><text x="740" y="329" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">当前编辑</text><text x="726" y="401" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">禁用 / 只读</text><rect x="726" y="414" width="306" height="44" rx="8" fill="#F5F7FB" stroke="#E2E9F2" stroke-width="1"/><text x="740" y="441" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">保留现有值</text><text x="726" y="513" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">校验失败</text><rect x="726" y="526" width="306" height="44" rx="8" fill="white" stroke="#C64555" stroke-width="1"/><text x="740" y="553" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">值超出允许范围</text><text x="726" y="590" fill="#C64555" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">保留草稿，可定位修复</text><text x="58" y="728" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">行为</text><text x="58" y="752" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">编辑器语言与游戏语言分开，固定文案/错误/节点说明/导出报告可翻译；用户原文/URL/ID/历史保持原文。</text><text x="58" y="795" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">约束</text><text x="58" y="819" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">不把同张中文稿算四语完成；不缩小关键字塞屏；状态不只靠颜色；读屏不逐Token播报。</text><text x="58" y="862" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">恢复</text><text x="58" y="886" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">切语言保持草稿/视口/选区/未答问题；动态错误可定位字段，模态关闭还原焦点。</text></svg>