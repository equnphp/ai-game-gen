-serif" font-size="13" font-weight="500" text-anchor="start">失败/取消传播</text><rect x="16" y="418" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="444" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">沿用当前预设</text><g transform="translate(346 430) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g></g><text x="16" y="488" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">父子/兄弟分支取消边界明确</text><g data-field-id="SUR-WN-008::SUR-WN-008-F03-01"><text x="16" y="547" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">循环最大次数</text><rect x="16" y="561" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="587" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">3</text><text x="351" y="586" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">↕</text><text x="374" y="616" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">次</text></g><text x="16" y="639" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">正整数或目录明确允许零次；普通线不形成无限回环</text><g data-field-id="SUR-WN-008::SUR-WN-008-F03-02"><text x="16" y="698" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">单次执行时间预算</text><rect x="16" y="712" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="738" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">0.25 s</text><text x="351" y="737" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">↕</text><text x="374" y="767" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">毫秒</text></g><text x="16" y="790" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">正时长，不越核心执行预算；超限转错误出口，不阻塞界面</text><g data-field-id="SUR-WN-008::SUR-WN-008-F03-03"><text x="16" y="849" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">递归最大深度</text><rect x="16" y="863" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="889" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">递归默认禁止；允许时用目录明示值</text><text x="374" y="918" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">层</text></g><text x="16" y="941" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">正整数且在能力范围；无可检查上限不可启用递归</text><g data-field-id="SUR-WN-008::SUR-WN-008-F04"><text x="16" y="1000" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">对象归属/退出策略</text><rect x="16" y="1014" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1040" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">对象销毁默认取消</text><g transform="translate(346 1026) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g></g><text x="16" y="1084" fill="#6A7B93" font-family=