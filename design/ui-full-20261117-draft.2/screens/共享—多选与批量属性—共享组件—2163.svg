 font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">保留草稿，可定位修复</text><text x="58" y="814" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">行为</text><text x="58" y="838" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">混合值显示不同值，未编辑字段保持各对象原值；批改先预览影响范围，合法整体事务提交。</text><text x="58" y="881" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">约束</text><text x="58" y="905" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">不把混合值当0/空，不给不同类型对象硬写同一组件；引用、层级和依赖整体检查。</text><text x="58" y="948" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">恢复</text><text x="58" y="972" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">保存失败保留选择与草稿；撤销恢复所有已提交项，不丢个别对象高级字段。</text></svg>