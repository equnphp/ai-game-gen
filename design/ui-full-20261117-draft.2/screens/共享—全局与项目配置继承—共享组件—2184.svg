e="13" font-weight="400" text-anchor="start">当前编辑</text><text x="726" y="401" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">禁用 / 只读</text><rect x="726" y="414" width="306" height="44" rx="8" fill="#F5F7FB" stroke="#E2E9F2" stroke-width="1"/><text x="740" y="441" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">保留现有值</text><text x="726" y="513" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">校验失败</text><rect x="726" y="526" width="306" height="44" rx="8" fill="white" stroke="#C64555" stroke-width="1"/><text x="740" y="553" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">值超出允许范围</text><text x="726" y="590" fill="#C64555" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">保留草稿，可定位修复</text><text x="58" y="766" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">行为</text><text x="58" y="790" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">作用域优先级可解释，改变配置只影响后续轮次或任务；运行中任务保留原版本。</text><text x="58" y="833" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">约束</text><text x="58" y="857" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">会话不能扩大项目允许范围；凭据是本机安全引用而非可分享配置；不同值不能静默覆盖。</text><text x="58" y="900" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">恢复</text><text x="58" y="924" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">移除被使用配置先给引用/替代选择；撤销授权按真实在途边界处理，不假撤回已发生效果。</text></svg>