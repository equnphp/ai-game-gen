6" y="1327" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">空值/未设置选择</text><rect x="16" y="1341" width="358" height="38" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1366" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">开启</text><rect x="326" y="1350" width="34" height="20" rx="10" fill="#246BEE" stroke="none" stroke-width="1"/><circle cx="351" cy="1360" r="7" fill="white" stroke="none" stroke-width="1"/><text x="374" y="1396" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">不适用</text></g><text x="16" y="1419" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">未设置、null、零、空串、空数组区分；不可空参数不提供置空</text><g data-field-id="SUR-WN-003::SUR-WN-003-F03"><text x="16" y="1478" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">对象/资源/表行引用</text><rect x="16" y="1492" width="358" height="84" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1516" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">星溪营地 / 主场景</text><text x="356" y="1516" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><path d="M26 1527L364 1527" fill="none" stroke="#E2E9F2" stroke-width="1" /><text x="28" y="1545" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">角色 / 冒险家</text><text x="356" y="1545" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><text x="28" y="1568" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">＋ 添加一项</text></g><text x="16" y="1612" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">必需引用存在；显示选中范围为当前/全部选中/集合</text><g data-field-id="SUR-WN-003::SUR-WN-003-F04"><text x="16" y="1671" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">恢复默认</text><rect x="16" y="1685" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1711" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">无自动重置</text></g><text x="16" y="1755" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">仅恢复当前字段；保留无关高级项</text><rect x="16" y="1823" width="358" height="44" rx="8" fill="#246BEE" stroke="none" stroke-width="1"/><text x="195" y="1850" fill="#FFFFFF" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">应用参数</text><rect x="16" y="1881" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="195" y="1908" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">定位引用</text></svg>