2" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">--service</text><text x="356" y="442" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><path d="M26 453L364 453" fill="none" stroke="#E2E9F2" stroke-width="1" /><text x="28" y="471" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">project-tools</text><text x="356" y="471" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><text x="28" y="494" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">＋ 添加一项</text></g><text x="16" y="538" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">每一数值参数各画控件；整数/小数、范围、单位来自该参数Schema；禁止NaN…</text><g data-field-id="SUR-WN-003::SUR-WN-003-F02-02"><text x="16" y="597" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">布尔参数</text><rect x="16" y="611" width="358" height="38" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="636" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">该参数Schema默认</text><rect x="326" y="620" width="34" height="20" rx="10" fill="#246BEE" stroke="none" stroke-width="1"/><circle cx="351" cy="630" r="7" fill="white" stroke="none" stroke-width="1"/><text x="374" y="666" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">不适用</text></g><text x="16" y="689" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">每一布尔参数独立开关；无默认且必填时须明确选择</text><g data-field-id="SUR-WN-003::SUR-WN-003-F02-03"><text x="16" y="748" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">枚举参数</text><rect x="16" y="762" width="358" height="84" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="786" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">--service</text><text x="356" y="786" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><path d="M26 797L364 797" fill="none" stroke="#E2E9F2" stroke-width="1" /><text x="28" y="815" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">project-tools</text><text x="356" y="815" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><text x="28" y="838" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">＋ 添加一项</text></g><text x="16" y="882" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">只能选已声明合法枚举；不自动取第一项冒充默认</text><g data-field-id="SUR-WN-003::SUR-WN-003-F02-04"><text x="16" y="941" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">文本参数</text><rect x="16" y="955" width="358" height="84" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="979" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">--service</text><text x="356" y="979" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><path d="M26 990L364 990" fill="none" stroke="#E2E9F2" stroke-width="1" /><text x="28" y="1008" fill="#172B4D" font-family=