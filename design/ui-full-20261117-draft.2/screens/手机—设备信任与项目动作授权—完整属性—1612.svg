ont-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">断开与撤销</text><rect x="16" y="844" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="870" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">随时可达，Android完整绘出</text></g><text x="16" y="914" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">撤销终止后续访问与未完成任务，完整副本不远程擦除</text><rect x="16" y="982" width="358" height="44" rx="8" fill="#246BEE" stroke="none" stroke-width="1"/><text x="195" y="1009" fill="#FFFFFF" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">保存范围</text><rect x="16" y="1040" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="195" y="1067" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">取消信任</text></svg>