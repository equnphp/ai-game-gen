<svg xmlns="http://www.w3.org/2000/svg" width="704" height="446" viewBox="0 0 704 446" role="img"><title>未输入/可编辑草稿</title><rect x="0" y="0" width="704" height="446" rx="14" fill="white" stroke="#E2E9F2" stroke-width="1"/><g transform="translate(17 20) scale(0.9166666666666666)" stroke="#246BEE" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></g><text x="49" y="39" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="600" text-anchor="start">未输入/可编辑草稿</text><text x="20" y="73" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="600" text-anchor="start">当前情况</text><text x="20" y="100" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">持续可见的输入框、讨论/执行模式、模型来源。</text><text x="20" y="140" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="600" text-anchor="start">可以继续做什么</text><rect x="20" y="158" width="664" height="44" rx="8" fill="#246BEE" stroke="none" stroke-width="1"/><text x="352" y="185" fill="#FFFFFF" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">输入</text><rect x="20" y="212" width="664" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="352" y="239" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">粘贴文字</text><rect x="20" y="266" width="664" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="352" y="293" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">选择上下文</text><rect x="20" y="320" width="664" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="352" y="347" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">空输入禁发并给原因</text><text x="20" y="381" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="600" text-anchor="start">恢复与保留</text><text x="20" y="405" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">IME组词不触发发送，草稿按会话保留。</text></svg>