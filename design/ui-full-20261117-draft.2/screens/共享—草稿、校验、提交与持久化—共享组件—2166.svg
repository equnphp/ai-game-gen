="400" text-anchor="start">焦点</text><rect x="726" y="302" width="306" height="44" rx="8" fill="white" stroke="#246BEE" stroke-width="1"/><text x="740" y="329" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">当前编辑</text><text x="726" y="401" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">禁用 / 只读</text><rect x="726" y="414" width="306" height="44" rx="8" fill="#F5F7FB" stroke="#E2E9F2" stroke-width="1"/><text x="740" y="441" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">保留现有值</text><text x="726" y="513" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">校验失败</text><rect x="726" y="526" width="306" height="44" rx="8" fill="white" stroke="#C64555" stroke-width="1"/><text x="740" y="553" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">值超出允许范围</text><text x="726" y="590" fill="#C64555" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">保留草稿，可定位修复</text><text x="58" y="762" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">行为</text><text x="58" y="786" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">UI草稿独立于领域权威；字段提交先校验；只有实际durable确认才显示已保存。</text><text x="58" y="829" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">约束</text><text x="58" y="853" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">提交受理不是落盘；队列满/冲突/权限撤销/结果未知要独立；每个目标项目由核心单写所有者提交。</text><text x="58" y="896" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">恢复</text><text x="58" y="920" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">失败保留输入及旧版；未知先查询原请求，不能换ID盲重放；恢复可读日志，不另建写库。</text></svg>