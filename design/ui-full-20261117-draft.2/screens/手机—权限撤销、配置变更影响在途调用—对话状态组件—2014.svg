<svg xmlns="http://www.w3.org/2000/svg" width="358" height="392" viewBox="0 0 358 392" role="img"><title>权限撤销/配置变更影响在途调用</title><rect x="0" y="0" width="358" height="392" rx="14" fill="white" stroke="#E2E9F2" stroke-width="1"/><g transform="translate(17 20) scale(0.9166666666666666)" stroke="#246BEE" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></g><text x="49" y="39" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="600" text-anchor="start">权限撤销/配置变更影响在途调用</text><text x="20" y="73" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="600" text-anchor="start">当前情况</text><text x="20" y="100" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">待执行/已执行/在途动作各自状态与原配置快照。</text><text x="20" y="140" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="600" text-anchor="start">可以继续做什么</text><rect x="20" y="158" width="318" height="44" rx="8" fill="#246BEE" stroke="none" stroke-width="1"/><text x="179" y="185" fill="#FFFFFF" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">终止未来调用</text><rect x="20" y="212" width="318" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="179" y="239" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">查看在途结果</text><rect x="20" y="266" width="318" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="179" y="293" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">重授权新范围</text><text x="20" y="327" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="600" text-anchor="start">恢复与保留</text><text x="20" y="351" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">撤销不伪造已发生效果回滚，不按新设置重解释旧调用。</text></svg>