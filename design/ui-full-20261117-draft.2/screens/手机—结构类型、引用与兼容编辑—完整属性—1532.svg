ht="500" text-anchor="middle">资源</text><g transform="translate(338 2709) scale(0.9166666666666666)" stroke="#246BEE" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></g><text x="350" y="2746" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="500" text-anchor="middle">更多</text><rect x="139" y="2760" width="112" height="4" rx="2" fill="#172B4D" stroke="none" stroke-width="1"/><rect x="16" y="169" width="358" height="58" rx="10" fill="#EDF4FF" stroke="none" stroke-width="1"/><text x="33" y="193" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">完整属性 · 含高级字段与展开子控件</text><text x="33" y="214" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">当前操作面全部控件已展开，校验与显示条件见交接索引。</text><g data-field-id="SUR-WN-030::SUR-WN-030-F01"><text x="16" y="261" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">字段树</text><rect x="16" y="275" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="301" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">来源结构或新字段</text></g><text x="16" y="345" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">稳定fieldId、名称、类型、数组/对象/引用</text><g data-field-id="SUR-WN-030::SUR-WN-030-F02-01"><text x="16" y="404" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">字段必填</text><rect x="16" y="418" width="358" height="38" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="443" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">来源required声明</text><rect x="326" y="427" width="34" height="20" rx="10" fill="#246BEE" stroke="none" stroke-width="1"/><circle cx="351" cy="437" r="7" fill="white" stroke="none" stroke-width="1"/><text x="374" y="473" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">不适用</text></g><text x="16" y="496" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">必填与可空分别判断，不能通过空串代替缺字段</text><g data-field-id="SUR-WN-030::SUR-WN-030-F02-02"><text x="16" y="555" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">允许null</text><rect x="16" y="569" width="358" height="38" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="594" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">来源nullable/type声明</text><rect x="326" y="578" width="34" height="20" rx="10" fill="#246BEE" stroke="none" stroke-width="1"/><circle cx="351" cy="588" r="7" fill="white" stroke="none" stroke-width="1"/><text x="374" y="624" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">不适用</text></g><text x="16" y="647" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">null与未提供区分；与类型/默认一致</text><g data-field-id="SUR-WN-030::SUR-WN-030-F02-03"><text x="16" y="706" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">默认值</text><rect x="16" y="720" width="358" height="84" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="744" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">id · string · 必填</text><text x="356" y="744" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><path d="M26 755L364 755" fill="none" stroke="#E2E9F2" stroke-width="1" /><text x="28" y="773" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">coins · integer</text><text x="356" y="773" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><text x="28" y="796" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">＋ 添加一项</text></g><text x="16" y="840" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">默认值须满足本字段全部约束；无默认不等于0</text><g data-field-id="SUR-WN-030::SUR-WN-030-F02-04"><text x="16" y="899" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">单位</text><rect x="16" y="913" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="939" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">来源单位或明确无量纲</text><g transform="translate(346 925) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="374" y="968" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">单位枚举</text></g><text x="16" y="991" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">不能把秒/毫秒、格/像素暗换；转换需显式已注册规则</text><g data-field-id="SUR-WN-030::SUR-WN-030-F02-05"><text x="16" y="1050" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">最小值</text><rect x="16" y="1064" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1090" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">来源minimum或未限制</text><text x="351" y="1089" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">↕</text><text x="374" y="1119" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">字段单位</text></g><text x="16" y="1142" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">与类型及最大值一致；是否含边界由来源明确</text><g data-field-id="SUR-WN-030::SUR-WN-030-F02-06"><text x="16" y="1201" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">最大值</text><rect x="16" y="1215" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1241" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">来源maximum或未限制</text><text x="351" y="1240" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">↕</text><text x="374" y="1270" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">字段单位</text></g><text x="16" y="1293" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">不小于最小值；不得高于适配器编码上限</text><g data-field-id="SUR-WN-030::SUR-WN-030-F02-07"><text x="16" y="1352" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">最短长度/最少项</text><rect x="16" y="1366" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1392" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">查看 / 编辑</text><text x="374" y="1421" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">字符或项，按字段类型</text></g><text x="16" y="1444" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">非负整数；与最大长度/项数一致</text><g data-field-id="SUR-WN-030::SUR-WN-030-F02-08"><text x="16" y="1503" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">最长长度/最多项</text><rect x="16" y="1517" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1543" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">查看 / 编辑</text><text x="374" y="1572" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">字符或项，按字段类型</text></g><text x="16" y="1595" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">非负整数；不得低于最小值；能力未知标未确认</text><g data-field-id="SUR-WN-030::SUR-WN-030-F02-09"><text x="16" y="1654" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">允许枚举值</text><rect x="16" y="1668" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1694" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">来源enum或无枚举</text><g transform="translate(346 1680) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="374" y="1723" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">按字段类型</text></g><text x="16" y="1746" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">逐项按字段类型编辑；默认必须属于枚举</text><g data-field-id="SUR-WN-030::SUR-WN-030-F02-10"><text x="16" y="1805" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">字符串格式/模式</text><rect x="16" y="1819" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="1845" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">沿用当前预设</text><g transform="translate(346 1831) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="374" y="1874" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="end">不适用</text></g><text x="16" y="1897" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">只校验声明数据格式，不执行模式中的命令/脚本；复杂度限额取解析器能力</text><text x="16" y="1956" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">示例/私密字段</text><g data-field-id="SUR-WN-030::SUR-WN-030-F03-part0"><text x="16" y="1986" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">示例</text><rect x="16" y="2000" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="2026" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">未配置/按来源</text></g><g data-field-id="SUR-WN-030::SUR-WN-030-F03-part1"><text x="16" y="2079" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">私密字段</text><rect x="16" y="2093" width="358" height="38" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="2118" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">开启</text><rect x="326" y="2102" width="34" height="20" rx="10" fill="#246BEE" stroke="none" stroke-width="1"/><circle cx="351" cy="2112" r="7" fill="white" stroke="none" stroke-width="1"/></g><text x="16" y="2180" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">示例须合法且无真实秘密，私密标记参与日志脱敏</text><text x="16" y="2239" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">引用与兼容</text><g data-field-id="SUR-WN-030::SUR-WN-030-F04-part0"><text x="16" y="2269" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">引用与兼容</text><rect x="16" y="2283" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="2309" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">选择兼容内容</text><g transform="translate(346 2295) scale(0.6666666666666666)" stroke="#6A7B93" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g></g><g data-field-id="SUR-WN-030::SUR-WN-030-F04-part1"><text x="16" y="2362" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="start">附加参数</text><rect x="16" y="2376" width="358" height="40" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="28" y="2402" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">查看 / 编辑</text></g><text x="16" y="2463" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="10" font-weight="400" text-anchor="start">解析ref受授权范围/深度限制，不自动读任意远程</text><rect x="16" y="2531" width="358" height="44" rx="8" fill="#246BEE" stroke="none" stroke-width="1"/><text x="195" y="2558" fill="#FFFFFF" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">保存Schema</text><rect x="16" y="2589" width="358" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="195" y="2616" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">改名/移除字段</text></svg>