or="start">保留现有值</text><text x="726" y="513" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">校验失败</text><rect x="726" y="526" width="306" height="44" rx="8" fill="white" stroke="#C64555" stroke-width="1"/><text x="740" y="553" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">值超出允许范围</text><text x="726" y="590" fill="#C64555" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">保留草稿，可定位修复</text><text x="58" y="728" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">行为</text><text x="58" y="752" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">资源许可随工程/产物清单保留；本机处理不扣平台积分；自带Key/Go与平台积分分开。</text><text x="58" y="795" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">约束</text><text x="58" y="819" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">未许可不能默认可再分发；免费用完不静默转付费；供应商没有usage不伪造账单。</text><text x="58" y="862" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">恢复</text><text x="58" y="886" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">受限项可替换/排除/保留待处理；后续云任务结果不明先查，已交付入库失败可恢复。</text></svg>