osoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><path d="M68 540L648 540" fill="none" stroke="#E2E9F2" stroke-width="1" /><text x="70" y="558" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">角色 / 冒险家</text><text x="640" y="558" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" font-weight="400" text-anchor="start">⋮</text><text x="70" y="581" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">＋ 添加一项</text></g><rect x="58" y="643" width="600" height="44" rx="8" fill="#246BEE" stroke="none" stroke-width="1"/><text x="358" y="670" fill="#FFFFFF" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">加载更多</text><rect x="58" y="697" width="600" height="44" rx="8" fill="#FFFFFF" stroke="#E2E9F2" stroke-width="1"/><text x="358" y="724" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="500" text-anchor="middle">清除筛选</text><text x="726" y="177" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">默认</text><rect x="726" y="190" width="306" height="44" rx="8" fill="white" stroke="#E2E9F2" stroke-width="1"/><text x="740" y="217" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">输入内容</text><text x="726" y="289" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">焦点</text><rect x="726" y="302" width="306" height="44" rx="8" fill="white" stroke="#246BEE" stroke-width="1"/><text x="740" y="329" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">当前编辑</text><text x="726" y="401" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">禁用 / 只读</text><rect x="726" y="414" width="306" height="44" rx="8" fill="#F5F7FB" stroke="#E2E9F2" stroke-width="1"/><text x="740" y="441" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">保留现有值</text><text x="726" y="513" fill="#6A7B93" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="12" font-weight="400" text-anchor="start">校验失败</text><rect x="726" y="526" width="306" height="44" rx="8" fill="white" stroke="#C64555" stroke-width="1"/><text x="740" y="553" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">值超出允许范围</text><text x="726" y="590" fill="#C64555" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="11" font-weight="400" text-anchor="start">保留草稿，可定位修复</text><text x="58" y="809" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">行为</text><text x="58" y="833" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">无内容与无匹配分开；分页保持阅读锚点，按稳定业务ID定位未挂载项；多层/锁定/隐藏状态可见。</text><text x="58" y="876" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">约束</text><text x="58" y="900" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">不能用DOM未挂载当对象不存在；加载历史不自动滚底；依赖/权限/资源未ready提供具体原因。</text><text x="58" y="943" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start">恢复</text><text x="58" y="967" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start">返回保留搜索、筛选、页/树展开及选区；搜索失败不清空已有数据。</text></svg>