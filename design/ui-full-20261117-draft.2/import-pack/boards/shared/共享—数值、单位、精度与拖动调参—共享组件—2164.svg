-CMP-04__0047__文字_拒绝NaN_无穷_溢出_边界_精度取产品规则和架构能力_" data-name="文字_拒绝NaN/无穷/溢出；边界/精度取产品规则和架构能力，">拒绝NaN/无穷/溢出；边界/精度取产品规则和架构能力，超范围不静默截断；概率/时长/成本遵守所在域。</text><text x="58" y="862" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start" id="component-CMP-04__0048__文字_恢复" data-name="文字_恢复">恢复</text><text x="58" y="886" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start" id="component-CMP-04__0049__文字_错误保留原文本与最后有效值_Esc取消本次调参_显示默认" data-name="文字_错误保留原文本与最后有效值，Esc取消本次调参；显示默认">错误保留原文本与最后有效值，Esc取消本次调参；显示默认来源是模板/项目/继承。</text></svg>