3" font-weight="600" text-anchor="start" id="component-CMP-19__0046__文字_恢复" data-name="文字_恢复">恢复</text><text x="58" y="886" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start" id="component-CMP-19__0047__文字_受限项可替换_排除_保留待处理_后续云任务结果不明先查_" data-name="文字_受限项可替换/排除/保留待处理；后续云任务结果不明先查，">受限项可替换/排除/保留待处理；后续云任务结果不明先查，已交付入库失败可恢复。</text></svg>