serif" font-size="13" font-weight="600" text-anchor="start" id="component-CMP-05__0046__文字_恢复" data-name="文字_恢复">恢复</text><text x="58" y="886" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start" id="component-CMP-05__0047__文字_重名提供保留两份_改名_取消_不能默盖_URL_ID_变" data-name="文字_重名提供保留两份/改名/取消，不能默盖；URL/ID/变">重名提供保留两份/改名/取消，不能默盖；URL/ID/变量/用户名称不随语言切换重写。</text></svg>