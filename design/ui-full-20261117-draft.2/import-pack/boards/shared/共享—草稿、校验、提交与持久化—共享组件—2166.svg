id="component-CMP-06__0047__文字_行为" data-name="文字_行为">行为</text><text x="58" y="786" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start" id="component-CMP-06__0048__文字_UI草稿独立于领域权威_字段提交先校验_只有实际dura" data-name="文字_UI草稿独立于领域权威；字段提交先校验；只有实际dura">UI草稿独立于领域权威；字段提交先校验；只有实际durable确认才显示已保存。</text><text x="58" y="829" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start" id="component-CMP-06__0049__文字_约束" data-name="文字_约束">约束</text><text x="58" y="853" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start" id="component-CMP-06__0050__文字_提交受理不是落盘_队列满_冲突_权限撤销_结果未知要独立" data-name="文字_提交受理不是落盘；队列满/冲突/权限撤销/结果未知要独立">提交受理不是落盘；队列满/冲突/权限撤销/结果未知要独立；每个目标项目由核心单写所有者提交。</text><text x="58" y="896" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start" id="component-CMP-06__0051__文字_恢复" data-name="文字_恢复">恢复</text><text x="58" y="920" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start" id="component-CMP-06__0052__文字_失败保留输入及旧版_未知先查询原请求_不能换ID盲重放_" data-name="文字_失败保留输入及旧版；未知先查询原请求，不能换ID盲重放；">失败保留输入及旧版；未知先查询原请求，不能换ID盲重放；恢复可读日志，不另建写库。</text></svg>