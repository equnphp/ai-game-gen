xt-anchor="start" id="component-CMP-02__0070__文字_约束" data-name="文字_约束">约束</text><text x="58" y="1099" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start" id="component-CMP-02__0071__文字_必需引用不能静默清空为可用值_可选空值明确_同名按路径_" data-name="文字_必需引用不能静默清空为可用值；可选空值明确；同名按路径/">必需引用不能静默清空为可用值；可选空值明确；同名按路径/所属区分；不可用项给原因。</text><text x="58" y="1142" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start" id="component-CMP-02__0072__文字_恢复" data-name="文字_恢复">恢复</text><text x="58" y="1166" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start" id="component-CMP-02__0073__文字_取消保留原引用与搜索上下文_目标被删显示断链_替换_取消" data-name="文字_取消保留原引用与搜索上下文；目标被删显示断链、替换/取消">取消保留原引用与搜索上下文；目标被删显示断链、替换/取消/保留草稿错误。</text></svg>