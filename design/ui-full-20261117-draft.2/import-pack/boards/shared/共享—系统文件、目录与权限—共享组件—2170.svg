求关闭防火墙。</text><text x="58" y="862" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start" id="component-CMP-10__0046__文字_恢复" data-name="文字_恢复">恢复</text><text x="58" y="886" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start" id="component-CMP-10__0047__文字_拒绝保留本地编辑和已选合法内容_换位置_重新授权后回到原" data-name="文字_拒绝保留本地编辑和已选合法内容；换位置/重新授权后回到原">拒绝保留本地编辑和已选合法内容；换位置/重新授权后回到原动作，凭据不写工程。</text></svg>