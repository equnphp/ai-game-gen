续轮次或任务；运行中">作用域优先级可解释，改变配置只影响后续轮次或任务；运行中任务保留原版本。</text><text x="58" y="833" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start" id="component-CMP-24__0048__文字_约束" data-name="文字_约束">约束</text><text x="58" y="857" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start" id="component-CMP-24__0049__文字_会话不能扩大项目允许范围_凭据是本机安全引用而非可分享配" data-name="文字_会话不能扩大项目允许范围；凭据是本机安全引用而非可分享配">会话不能扩大项目允许范围；凭据是本机安全引用而非可分享配置；不同值不能静默覆盖。</text><text x="58" y="900" fill="#246BEE" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="600" text-anchor="start" id="component-CMP-24__0050__文字_恢复" data-name="文字_恢复">恢复</text><text x="58" y="924" fill="#172B4D" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="400" text-anchor="start" id="component-CMP-24__0051__文字_移除被使用配置先给引用_替代选择_撤销授权按真实在途边界" data-name="文字_移除被使用配置先给引用/替代选择；撤销授权按真实在途边界">移除被使用配置先给引用/替代选择；撤销授权按真实在途边界处理，不假撤回已发生效果。</text></svg>