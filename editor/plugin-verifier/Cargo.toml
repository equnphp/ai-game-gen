# 单独构建根隔离 JSON feature，不能作为编辑器宿主的 Rust 依赖。
[workspace]

[package]
name = "gamegen-plugin-verifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "digest", "zeroize"] }
serde_json_canonicalizer = { version = "=0.3.2", default-features = false }
ryu-js = { version = "=1.0.3", default-features = false }
jsonschema = { version = "=0.61.2", default-features = false }
