# 宿主使用MSVC Rust，核心DLL仍由原LLVM-MinGW工程独立生产。
[package]
name = "gamegen-editor-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
[lib]
name = "gamegen_editor_host"
crate-type = ["staticlib", "cdylib", "rlib"]
# 二进制和库使用不同名称，避免Windows调试符号文件冲突。
[[bin]]
name = "gamegen-editor"
path = "src/main.rs"
[features]
# 独立运行时内嵌生产资源，不要求常驻开发服务器。
custom-protocol = ["tauri/custom-protocol"]
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
uuid = { version = "=1.18.1", features = ["v4"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
fs2 = "=0.4.3"
[profile.release]
panic = "unwind"
