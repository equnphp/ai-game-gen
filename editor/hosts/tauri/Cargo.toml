# 宿主使用MSVC Rust，核心DLL仍由原LLVM-MinGW工程独立生产。
[package]
name = "gamegen-editor-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
[lib]
name = "gamegen_editor_host"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
uuid = { version = "=1.18.1", features = ["v4"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
fs2 = "=0.4.3"
[profile.release]
panic = "unwind"
