# 自定义命令只在main能力下开放；所有路径由可信宿主决定。
[[permission]]
identifier = "allow-core-dispatch"
description = "Forward bounded commands to the native Core actor"
commands.allow = ["core_dispatch"]
[[permission]]
identifier = "allow-ux-dispatch"
description = "Access device-local editor preferences"
commands.allow = ["ux_dispatch"]
[[permission]]
identifier = "allow-host-bootstrap"
description = "Receive this window's private grant reference"
commands.allow = ["host_bootstrap"]
[[permission]]
identifier = "allow-workspace-dispatch"
description = "Access bounded local project discovery and verified opening jobs"
commands.allow = ["workspace_dispatch"]
